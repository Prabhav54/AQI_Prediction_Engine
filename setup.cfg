[metadata]
name = pan-india-aq-engine
version = 0.1.0

[options]
packages = find:
python_requires = >=3.11

[tool:pytest]
# Tells pytest the project root is a Python package root.
# This is what fixes "ModuleNotFoundError: No module named 'api.schemas'"
# on Windows when running uvicorn or pytest from the project root.
testpaths = tests
pythonpath = .

[flake8]
max-line-length = 120
# Project style: aligned assignments/kwargs, and sys.path setup before imports in entry scripts
extend-ignore = E221, E251, E272, E241, E402, W503, E731
exclude = __pycache__, .env, logs, .git, data, .venv, venv