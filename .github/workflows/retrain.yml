name: Weekly retrain

# Rebuild 180 days of history, retrain LSTM + GRU + LightGBM, and promote the
# new generation only if it beats the deployed champion on the same recent
# test window. Promoted checkpoints are committed back to main.
on:
  schedule:
    - cron: "30 1 * * 0"     # Sundays 01:30 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to train on"
        default: "180"

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LOG_LEVEL: INFO
      DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-pipeline.txt

      - name: Date window
        id: win
        run: |
          echo "end=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u -d "${{ inputs.days || 180 }} days ago" +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache backfill parts (resumable across retries)
        uses: actions/cache@v4
        with:
          path: data/history_parts
          key: history-${{ steps.win.outputs.start }}-${{ steps.win.outputs.end }}

      - name: Backfill history from Open-Meteo
        run: >
          python run_pipeline.py backfill --start ${{ steps.win.outputs.start }}
          --end ${{ steps.win.outputs.end }} --grid-stride 10 --out data/history.parquet

      - name: Train + champion/challenger gate
        run: >
          python forecasting/train.py --source parquet --data data/history.parquet
          --promote-if-better --max-train 80000 --epochs 10 --test-days 21 --val-days 14

      - name: Commit promoted model
        run: |
          git config user.name "aqi-retrain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecasting/checkpoints/lstm.pt forecasting/checkpoints/gru.pt \
                  forecasting/checkpoints/lgbm.joblib forecasting/checkpoints/*.json
          if git diff --cached --quiet; then
            echo "Champion kept — nothing to commit."
          else
            git commit -m "Retrain: promote $(python -c 'import json;print(json.load(open("forecasting/checkpoints/model_card.json"))["model_version"])')"
            git push
          fi
