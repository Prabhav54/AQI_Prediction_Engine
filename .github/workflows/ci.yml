name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 isort black pytest pytest-asyncio
          pip install numpy pandas scikit-learn xgboost joblib lightgbm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn pydantic httpx requests tenacity loguru python-dotenv sqlalchemy
          pip install psycopg2-binary asyncpg

      - name: Lint with flake8
        run: flake8 . --count --max-line-length=100 --exclude=__pycache__,.env,logs,.git,venv,.venv --statistics

      - name: Check import order (isort)
        run: isort --check-only --diff . --skip venv --skip .venv --skip logs

      - name: Check formatting (black)
        run: black --check --diff . --exclude "/(venv|\.venv|logs)/"

      - name: Run tests
        env:
          DATABASE_URL: "postgresql+asyncpg://aq_user:aq_pass@localhost:5432/air_quality_db"
          DATABASE_URL_SYNC: "postgresql://aq_user:aq_pass@localhost:5432/air_quality_db"
          LOG_LEVEL: "WARNING"
        run: pytest tests/ -v --tb=short -x --ignore=tests/test_pipeline.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/