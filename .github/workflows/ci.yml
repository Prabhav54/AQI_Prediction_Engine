name: CI

on:
  push:
    branches: ["main", "dev", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: aq_user
          POSTGRES_PASSWORD: aq_pass
          POSTGRES_DB: air_quality_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aq_user" --health-interval 5s --health-retries 20

    env:
      DATABASE_URL_SYNC: postgresql://aq_user:aq_pass@localhost:5432/air_quality_db
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 . --count --statistics

      - name: Apply schema (also tests TimescaleDB upgrades + SQL CPCB functions)
        run: python database/setup_db.py

      - name: Run tests
        run: pytest -v --tb=short
